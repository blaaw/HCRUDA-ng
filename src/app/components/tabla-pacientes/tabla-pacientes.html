<section class="seccion-pacientes">
  <h2 class="titulo-seccion">Pacientes</h2>

  <mat-form-field class="buscador">
    <mat-label>Buscar por nombre</mat-label>
    <input matInput [(ngModel)]="filtroNombre" placeholder="Nombre o apellidos" />
  </mat-form-field>

  <table mat-table [dataSource]="pacientesFiltrados" class="tabla-datos">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
    </ng-container>
    <ng-container matColumnDef="apellidos">
      <th mat-header-cell *matHeaderCellDef>Apellidos</th>
      <td mat-cell *matCellDef="let p">{{ p.apellidos }}</td>
    </ng-container>
    <ng-container matColumnDef="dni">
      <th mat-header-cell *matHeaderCellDef>DNI</th>
      <td mat-cell *matCellDef="let p">{{ p.dni }}</td>
    </ng-container>
    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef>Teléfono</th>
      <td mat-cell *matCellDef="let p">{{ p.telefono }}</td>
    </ng-container>
    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let p"><span class="etiqueta">{{ p.tipo }}</span></td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let fila; columns: columnas;" (click)="verDetalle(fila.id)"></tr>
  </table>

  @if (pacientesFiltrados.length === 0) {
    <p class="sin-datos">No se encontraron pacientes.</p>
  }
</section>
