<nav class="menu-simple">
  <div class="logo">
    <img src="/favicon.ico" alt="Logo HCRUDA" />
    <span class="titulo">HCRUDA</span>
  </div>

  <ul class="enlaces">
    @for (item of menuItems; track item.ruta) {
      <li>
        <a [routerLink]="item.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
          <mat-icon>{{ item.icono }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  @if (usuarioConectado()) {
    <div class="perfil-sesion">
      <div class="info-perfil">
        <div class="avatar">{{ usuarioConectado()?.nombre.charAt(0) }}</div>
        <span class="nombre-usuario">{{ usuarioConectado()?.nombre }}</span>
      </div>
      <button class="btn-salir" (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        <span>Salir</span>
      </button>
    </div>
  }
</nav>
