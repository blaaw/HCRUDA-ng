<div class="panel-dashboard">
  <app-menu-simple></app-menu-simple>

  <div class="contenido-principal">
    <mat-toolbar class="barra-superior">
      <span class="espaciador"></span>

      @if (usuarioConectado()) {
        <div class="info-usuario">
          <div class="avatar">{{ usuarioConectado()?.nombre.charAt(0) }}</div>
          <div class="datos-usuario">
            <div class="nombre-usuario">{{ usuarioConectado()?.nombre }}</div>
            <div class="rol-usuario">{{ usuarioConectado()?.rol }}</div>
          </div>
          <button mat-button class="boton-cerrar" (click)="cerrarSesion()">
            <mat-icon>logout</mat-icon>
            <span>Salir</span>
          </button>
        </div>
      }
    </mat-toolbar>

    <main class="area-contenido">
      <section class="seccion-resumen">
        <h2 class="titulo-seccion">Resumen</h2>
        <div class="tarjetas-resumen">
          <mat-card class="tarjeta-resumen">
            <mat-card-header>
              <mat-card-title>Pacientes</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <div class="numero-grande">{{ cantidadPacientes }}</div>
            </mat-card-content>
            <mat-card-actions>
              <button mat-button (click)="irAPagina('/pacientes')">Ver todos</button>
            </mat-card-actions>
          </mat-card>

          <mat-card class="tarjeta-resumen">
            <mat-card-header>
              <mat-card-title>Doctores</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <div class="numero-grande">{{ cantidadMedicos }}</div>
            </mat-card-content>
            <mat-card-actions>
              <button mat-button (click)="irAPagina('/doctores')">Ver todos</button>
            </mat-card-actions>
          </mat-card>

          <mat-card class="tarjeta-resumen">
            <mat-card-header>
              <mat-card-title>Citas</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <div class="numero-grande">{{ cantidadCitas }}</div>
            </mat-card-content>
            <mat-card-actions>
              <button mat-button (click)="irAPagina('/citas')">Ver todas</button>
            </mat-card-actions>
          </mat-card>
        </div>
      </section>

      <section class="seccion-tabla">
        <app-tabla-pacientes [pacientes]="listaPacientes()" (seleccionarPaciente)="verDetallePaciente($event)"></app-tabla-pacientes>
      </section>

      <section class="seccion-tabla">
        <app-tabla-medicos [medicos]="listaMedicos()" [departamentos]="listaDepartamentos()" (seleccionarMedico)="verDetalleMedico($event)"></app-tabla-medicos>
      </section>
    </main>
  </div>
</div>
